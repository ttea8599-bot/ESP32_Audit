name: build-firmware

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v1

      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: |
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install --git-url https://github.com/ESP32Async/AsyncTCP
          arduino-cli lib install --git-url https://github.com/ESP32Async/ESPAsyncWebServer

      - name: Embed web assets into firmware
        run: python3 tools/embed_assets.py

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=huge_app \
            --output-dir out \
            .

      - name: Merge to single flashable image
        run: |
          pip install esptool
          BOOTAPP=$(find ~/.arduino15 -name boot_app0.bin | head -1)
          esptool --chip esp32 merge_bin -o out/ESP32_Audit_full.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000  out/ESP32_Audit.ino.bootloader.bin \
            0x8000  out/ESP32_Audit.ino.partitions.bin \
            0xe000  "$BOOTAPP" \
            0x10000 out/ESP32_Audit.ino.bin

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ESP32_Audit_firmware
          path: out/ESP32_Audit_full.bin
